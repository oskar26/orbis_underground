plugins {
    id 'java'
}

group = 'orbis_underground'
version = '1.0.0'

repositories {
    mavenCentral()
}

// Hytale server JAR must be placed in libs/ for compilation
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    manifest {
        attributes(
            'Plugin-Id': 'orbis_underground',
            'Plugin-Name': 'Orbis Underground',
            'Plugin-Version': '1.0.0',
            'Plugin-Class': 'orbis_underground.OrbisUndergroundPlugin'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
